function hashRot(id){const n=[...id].reduce((a,c)=>a+c.charCodeAt(0),0);return((n%9)-4)*0.45;}
function uid(){return 'f'+Date.now()+Math.random().toString(36).slice(2,5);}
function catUid(){return 'c'+Date.now()+Math.random().toString(36).slice(2,5);}
function autoColors(hex){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  const lum=0.299*r+0.587*g+0.114*b;
  return{bg:hex,text:lum>148?'#2a1608':'#f5ede0',
    border:`#${Math.round(r*.72).toString(16).padStart(2,'0')}${Math.round(g*.72).toString(16).padStart(2,'0')}${Math.round(b*.72).toString(16).padStart(2,'0')}`};
}

// ─ Week helpers ──────────────────────────────────────────────────────────────
function getWeekMonday(off=0){
  const now=new Date(),d=now.getDay(),mon=new Date(now);
  mon.setDate(now.getDate()+(d===0?-6:1-d)+off*7);
  mon.setHours(0,0,0,0);return mon;
}
function weekKey(off=0){
  const m=getWeekMonday(off);
  return`w${m.getFullYear()}${String(m.getMonth()+1).padStart(2,'0')}${String(m.getDate()).padStart(2,'0')}`;
}
function weekShortLabel(off=0){
  const mon=getWeekMonday(off),sun=new Date(mon);
  sun.setDate(mon.getDate()+6);
  const m1=MONTHS_S[mon.getMonth()],m2=MONTHS_S[sun.getMonth()];
  const s=m1===m2?`${mon.getDate()}–${sun.getDate()} ${m1}`:`${mon.getDate()} ${m1}–${sun.getDate()} ${m2}`;
  return off===0?`● ${s}`:s;
}
function weekLongLabel(off=0){
  if(off===0)return'Questa settimana';
  if(off===-1)return'Settimana scorsa';
  if(off===1)return'Prossima settimana';
  return weekShortLabel(off).replace('● ','');
}

// ─ Canvas helpers ─────────────────────────────────────────────────────────────
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function generateMenuCanvas(meals, foods, cats, weekOff){
  const fm=Object.fromEntries(foods.map(f=>[f.id,f]));
  const SC=2, W=420, PY=74, ROW=70, GAP=4, DW=30, MG=6;
  const COL=(W-DW-MG*3)/2;
  const H=PY+(ROW+GAP)*7+20;
  const c=document.createElement('canvas');
  c.width=W*SC; c.height=H*SC;
  const cx=c.getContext('2d'); cx.scale(SC,SC);

  // Wood background
  cx.fillStyle='#c09858'; cx.fillRect(0,0,W,H);
  // Grain lines
  cx.strokeStyle='rgba(0,0,0,0.04)'; cx.lineWidth=1;
  for(let i=0;i<H;i+=6){cx.beginPath();cx.moveTo(0,i);cx.lineTo(W,i);cx.stroke();}

  // Header bar
  cx.fillStyle='#231106'; cx.fillRect(0,0,W,38);
  cx.fillStyle='#f4e6cc';
  cx.font='bold 20px serif'; cx.textAlign='center';
  cx.fillText('🍽️  Menu Settimanale',W/2,26);

  // Week bar
  cx.fillStyle='#3a1806'; cx.fillRect(0,38,W,28);
  cx.fillStyle='#f0dab8'; cx.font='bold 14px serif'; cx.textAlign='center';
  cx.fillText(weekShortLabel(weekOff).replace('● ',''),W/2,56);

  // Column headers
  const c1x=MG+DW+MG, c2x=MG+DW+MG+COL+MG;
  cx.fillStyle='#2c1206'; cx.font='bold 13px serif';
  cx.fillText('🌞 Pranzo',c1x+COL/2,PY-6);
  cx.fillText('🌙 Cena',c2x+COL/2,PY-6);

  DAYS.forEach((day,di)=>{
    const y=PY+(ROW+GAP)*di;
    // Day chip
    cx.fillStyle='#3a1806';
    rrect(cx,MG,y,DW,ROW,4); cx.fill();
    cx.fillStyle='#f0dab8'; cx.font='bold 10px serif'; cx.textAlign='center';
    DAYS_SHORT[di].split('').forEach((ch,i)=>{
      cx.fillText(ch,MG+DW/2,y+12+i*12);
    });

    ['Pranzo','Cena'].forEach((meal,mi)=>{
      const ck=`${day}-${meal}`;
      const cx2=mi===0?c1x:c2x;
      const ids=meals[ck]||[];

      // Cell
      cx.fillStyle='rgba(255,248,225,0.5)';
      rrect(cx,cx2,y,COL,ROW,4); cx.fill();
      cx.strokeStyle='rgba(148,108,52,0.3)'; cx.lineWidth=1.5;
      rrect(cx,cx2,y,COL,ROW,4); cx.stroke();

      // Tags
      let tx=cx2+4,ty=y+6;
      ids.forEach(id=>{
        const f=fm[id]; if(!f)return;
        const cat=cats[f.cat]||INIT_CATS.altro;
        cx.font='bold 11px serif';
        const tw=cx.measureText(f.name).width+10;
        if(tx+tw>cx2+COL-3){tx=cx2+4;ty+=20;}
        if(ty+18>y+ROW-2)return;
        // Tag background with shadow
        cx.shadowColor='rgba(0,0,0,0.15)'; cx.shadowBlur=2; cx.shadowOffsetY=1;
        cx.fillStyle=cat.bg;
        rrect(cx,tx,ty,tw,17,3); cx.fill();
        cx.shadowColor='transparent'; cx.shadowBlur=0; cx.shadowOffsetY=0;
        // Tag border
        cx.strokeStyle=cat.border; cx.lineWidth=1;
        rrect(cx,tx,ty,tw,17,3); cx.stroke();
        // Tag text
        cx.fillStyle=cat.text; cx.textAlign='left';
        cx.fillText(f.name,tx+5,ty+12);
        tx+=tw+3;
      });
    });
  });

  // Bottom footer
  cx.fillStyle='rgba(35,17,6,0.4)';
  cx.fillRect(0,H-18,W,18);
  cx.fillStyle='rgba(244,230,204,0.6)';
  cx.font='9px serif'; cx.textAlign='center';
  cx.fillText('Menu Settimanale',W/2,H-6);

  return c;
}


// ─ Crea menu dal Frigo ────────────────────────────────────────────────────────
function buildMenuFromFridge(fridge, foods, cats, existingMeals){
  const fm=Object.fromEntries(foods.map(f=>[f.id,f]));
  const PROTEINS=['carne','pesce','uova','legumi','latticini'];

  // Only use foods with qty > 0
  const avail={};
  fridge.forEach(item=>{ if((item.qty||0)>0) avail[item.foodId]=item.qty; });

  // Check if anything is available at all
  if(Object.keys(avail).length===0) return null;

  const pools={protein:[],carb:[],veggie:[]};
  Object.keys(avail).forEach(id=>{
    const f=fm[id]; if(!f) return;
    if(PROTEINS.includes(f.cat))              pools.protein.push(id);
    else if(f.cat==='pasta'||f.cat==='cereali') pools.carb.push(id);
    else if(f.cat==='verdure')                  pools.veggie.push(id);
  });

  const allSlots=[];
  DAYS.forEach(day=>['Pranzo','Cena'].forEach(m=>allSlots.push(`${day}-${m}`)));
  const emptySlots=allSlots.filter(ck=>!existingMeals[ck]||existingMeals[ck].length===0);
  if(!emptySlots.length) return null;

  // Check if we have enough ingredients to fill at least one slot
  const totalAvail=Object.values(avail).reduce((a,b)=>a+b,0);
  if(totalAvail===0) return null;

  const result={...existingMeals};

  function pickPool(pool){
    // Only pick from foods that still have qty > 0
    const available=pool.filter(id=>avail[id]>0);
    if(!available.length) return null;
    available.sort((x,y)=>avail[y]-avail[x]);
    const top=available.slice(0,Math.min(3,available.length));
    const chosen=top[Math.floor(Math.random()*top.length)];
    avail[chosen]--;
    return chosen;
  }

  let filled=0;
  emptySlots.forEach(ck=>{
    // Stop if nothing left in fridge
    const remaining=Object.values(avail).reduce((a,b)=>a+b,0);
    if(remaining===0) return;

    const meal=[];
    const p=pickPool(pools.protein);
    const c=pickPool(pools.carb);
    const v=pickPool(pools.veggie);
    if(p) meal.push(p);
    if(c) meal.push(c);
    if(v) meal.push(v);
    if(meal.length>0){ result[ck]=meal; filled++; }
  });

  return filled>0 ? result : null;
}

function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ─ Analisi storico per imparare abitudini ────────────────────────────────────
function analyzeHistory(allMeals, foods){
  const fm = Object.fromEntries(foods.map(f=>[f.id,f]));
  const coOccur   = {};   // "id1|id2" -> count
  const catByDay  = {};   // cat -> [7 counts Mon-Sun]
  const catByMeal = {};   // cat -> {Pranzo:n, Cena:n}

  Object.values(allMeals).forEach(weekMeals=>{
    DAYS.forEach((day,di)=>{
      ['Pranzo','Cena'].forEach(meal=>{
        const ids = weekMeals[`${day}-${meal}`]||[];
        ids.forEach(id=>{
          const f=fm[id]; if(!f) return;
          if(!catByDay[f.cat])  catByDay[f.cat]=Array(7).fill(0);
          if(!catByMeal[f.cat]) catByMeal[f.cat]={Pranzo:0,Cena:0};
          catByDay[f.cat][di]++;
          catByMeal[f.cat][meal]++;
        });
        for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
          const k=[ids[i],ids[j]].sort().join('|');
          coOccur[k]=(coOccur[k]||0)+1;
        }
      });
    });
  });
  return {coOccur, catByDay, catByMeal};
}

// ─ Sorprendimi bilanciato ─────────────────────────────────────────────────────
// Logica:
//  1. Distribuisce le proteine rispettando i target delle preferenze
//  2. Impara dagli abbinamenti dello storico
//  3. Varia gli alimenti evitando ripetizioni
function buildBalancedMenu(foods, cats, existingMeals, savedMeals, excluded, prefs, allMeals){
  const excSet = new Set(excluded||[]);
  const fm     = Object.fromEntries(foods.map(f=>[f.id,f]));

  // Raggruppa alimenti disponibili per categoria
  const byCat = {};
  foods.filter(f=>!excSet.has(f.id)).forEach(f=>{
    if(!byCat[f.cat]) byCat[f.cat]=[];
    byCat[f.cat].push(f);
  });

  const PROTEINS = ['carne','pesce','legumi','uova','latticini'];
  const CARBS    = ['pasta','cereali'];

  // Slot vuoti da riempire
  const allSlots = [];
  DAYS.forEach(day=>['Pranzo','Cena'].forEach(m=>allSlots.push(`${day}-${m}`)));
  const emptySlots = allSlots.filter(ck=>!(existingMeals[ck]?.length>0));
  if(!emptySlots.length) return null;

  // Analisi storico
  const history    = analyzeHistory(allMeals||{}, foods);
  const hasHistory = Object.keys(history.catByDay).length > 0;

  // ── Costruisci piano proteine per i pasti vuoti ───────────────────────────
  // Rispetta i target delle preferenze distribuendo uniformemente
  const prefsObj  = prefs||{};
  const protPlan  = []; // array di cat da assegnare ai pasti vuoti in ordine

  const availProt = PROTEINS.filter(k=>byCat[k]?.length>0);

  if(availProt.length > 0){
    // Quante volte ogni proteina deve apparire (cap = target utente)
    const targets = {};
    availProt.forEach(k=>{
      const already = Object.values(existingMeals).flat()
        .filter(id=>fm[id]?.cat===k).length;
      const userTarget = prefsObj[k]??2;
      targets[k] = Math.max(0, userTarget - already);
    });

    // Riempi un "mazzo" con le proteine nei numeri giusti
    const deck = [];
    availProt.forEach(k=>{ for(let i=0;i<targets[k];i++) deck.push(k); });

    // Se il mazzo è più corto dei pasti vuoti, ripeti ciclicamente
    // (può capitare se l'utente ha messo target bassi)
    while(deck.length < emptySlots.length){
      availProt.forEach(k=>{ if(byCat[k]?.length>0) deck.push(k); });
    }

    // Mescola il mazzo (Fisher-Yates)
    for(let i=deck.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [deck[i],deck[j]]=[deck[j],deck[i]];
    }

    // Evita stessa proteina in slot consecutivi (scambia se necessario)
    for(let i=1;i<emptySlots.length;i++){
      if(deck[i]===deck[i-1]){
        // Cerca un candidato da scambiare più avanti
        for(let j=i+1;j<deck.length;j++){
          if(deck[j]!==deck[i-1]){ [deck[i],deck[j]]=[deck[j],deck[i]]; break; }
        }
      }
    }

    protPlan.push(...deck.slice(0, emptySlots.length));
  }

  // ── Riempi i pasti ────────────────────────────────────────────────────────
  const result = {...existingMeals};
  // Traccia alimenti già usati questa settimana per variare
  const usedFoods = new Set(Object.values(existingMeals).flat());

  emptySlots.forEach((ck, idx)=>{
    const meal = [];

    // Usa ricetta salvata ~30% delle volte se esistono
    const validCombos = (savedMeals||[]).filter(c=>
      c.foodIds.every(id=>fm[id]&&!excSet.has(id))
    );
    if(validCombos.length>0 && Math.random()<0.30){
      const combo = randFrom(validCombos);
      result[ck] = [...combo.foodIds];
      result[`__label__${ck}`] = combo.name;
      combo.foodIds.forEach(id=>usedFoods.add(id));
      return;
    }

    // ── Proteina ──────────────────────────────────────────────────────────
    const protCat = protPlan[idx];
    if(protCat && byCat[protCat]?.length>0){
      // Preferisci alimenti non ancora usati questa settimana
      const pool = byCat[protCat];
      const fresh = pool.filter(f=>!usedFoods.has(f.id));
      const source = fresh.length>0 ? fresh : pool;

      // Boost storico: favorisci abbinamenti che l'utente fa spesso
      let scored = source.map(f=>{
        let score = 1;
        if(hasHistory){
          // Boost se usato spesso in questo giorno/pasto
          const day = ck.split('-')[0];
          const di  = DAYS.indexOf(day);
          const mealType = ck.split('-')[1];
          score += (history.catByDay[f.cat]?.[di]||0) * 0.2;
          score += (history.catByMeal[f.cat]?.[mealType]||0) * 0.15;
        }
        return {f, score};
      });
      scored.sort((a,b)=>b.score-a.score);
      // Prendi tra i top 3 per avere variazione
      const top = scored.slice(0, Math.min(3, scored.length));
      const chosen = randFrom(top).f;
      meal.push(chosen.id);
      usedFoods.add(chosen.id);
    }

    // ── Carboidrato ───────────────────────────────────────────────────────
    const isLegumi = protPlan[idx]==='legumi';
    const carbFoods = CARBS.flatMap(c=>byCat[c]||[]);
    if(carbFoods.length>0 && (!isLegumi || Math.random()>0.6)){
      const freshCarbs = carbFoods.filter(f=>!usedFoods.has(f.id));
      const carbSource = freshCarbs.length>0 ? freshCarbs : carbFoods;
      // Boost co-occorrenza con la proteina scelta
      let carbScored = carbSource.map(f=>{
        let score = 1;
        if(hasHistory && meal.length>0){
          const key = [f.id, meal[0]].sort().join('|');
          score += (history.coOccur[key]||0) * 0.5;
        }
        return {f, score};
      });
      carbScored.sort((a,b)=>b.score-a.score);
      const top = carbScored.slice(0, Math.min(3, carbScored.length));
      const chosen = randFrom(top).f;
      meal.push(chosen.id);
      usedFoods.add(chosen.id);
    }

    // ── Verdura ───────────────────────────────────────────────────────────
    if(byCat['verdure']?.length>0){
      const used  = new Set(meal);
      const pool  = byCat['verdure'].filter(f=>!used.has(f.id));
      const fresh = pool.filter(f=>!usedFoods.has(f.id));
      const source= fresh.length>0 ? fresh : (pool.length>0 ? pool : byCat['verdure']);
      // Boost co-occorrenza con proteina
      let vegScored = source.map(f=>{
        let score=1;
        if(hasHistory && meal.length>0){
          const key=[f.id,meal[0]].sort().join('|');
          score+=(history.coOccur[key]||0)*0.4;
        }
        return {f,score};
      });
      vegScored.sort((a,b)=>b.score-a.score);
      const top=vegScored.slice(0,Math.min(4,vegScored.length));
      const chosen=randFrom(top).f;
      meal.push(chosen.id);
      usedFoods.add(chosen.id);
    }

    // Fallback
    if(meal.length===0 && foods.length>0) meal.push(randFrom(foods).id);
    result[ck] = meal;
  });

  return result;
}

// ─ Sub-components ─────────────────────────────────────────────────────────────
function Tag({food,cats,selected,dragging,onPointerDown,showX,onX}){
  const c=cats[food.cat]||INIT_CATS.altro;
  return(
    <span className={`tag${selected?' sel':''}${showX?' hx':''}${dragging?' dragging':''}`}
      style={{background:c.bg,color:c.text,borderColor:c.border,transform:`rotate(${hashRot(food.id)}deg)`}}
      onPointerDown={onPointerDown}>
      {food.name}
      {showX&&<button className="tx" onPointerDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();onX();}}>✕</button>}
    </span>
  );
}
function GhostTag({food,cats,x,y}){
  const c=cats[food.cat]||INIT_CATS.altro;
  return(
    <div className="ghost" style={{left:x,top:y}}>
      <span className="tag" style={{background:c.bg,color:c.text,borderColor:c.border,transform:`rotate(${hashRot(food.id)}deg) scale(1.1)`,boxShadow:'3px 6px 16px rgba(0,0,0,.35)'}}>
        {food.name}
      </span>
    </div>
  );
}
function TagPreview({name,emoji,color}){
  const{bg,text,border}=autoColors(color);
  return<span className="tag" style={{background:bg,color:text,borderColor:border,transform:'rotate(-1deg)'}}>{emoji} {name||'Anteprima'}</span>;
}
function ConfirmModal({msg,confirmLabel,warn,onConfirm,onCancel}){
  return(
    <div className="ov" onClick={onCancel}>
      <div className="mod mod-sm" onClick={e=>e.stopPropagation()}>
        <p className="mod-msg">{msg}</p>
        <div className="ma">
          <button className={warn?'mc-warn':'mc'} onClick={onConfirm}>{confirmLabel}</button>
          <button className="mk" onClick={onCancel}>Annulla</button>
        </div>
      </div>
    </div>
  );
}
function SpesaModal({meals,foods,cats,weekOff,onClose}){
  const [checked,setChecked]=useState(new Set());
  const [feedback,setFeedback]=useState('');
  const fm=useMemo(()=>Object.fromEntries(foods.map(f=>[f.id,f])),[foods]);
  const catOrder=Object.keys(cats);
  const grouped=useMemo(()=>{
    const ids=new Set(Object.values(meals).flat());
    const list=[...ids].map(id=>fm[id]).filter(Boolean)
      .sort((a,b)=>{const d=catOrder.indexOf(a.cat)-catOrder.indexOf(b.cat);return d!==0?d:a.name.localeCompare(b.name,'it');});
    const g={};list.forEach(f=>{if(!g[f.cat])g[f.cat]=[];g[f.cat].push(f);});
    return g;
  },[meals,foods,cats]);
  const isEmpty=Object.keys(grouped).length===0;
  function toggle(id){setChecked(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});}
  async function share(){
    let text=`🛒 Lista della Spesa\n📅 ${weekLongLabel(weekOff)}\n\n`;
    Object.entries(grouped).forEach(([cat,items])=>{
      text+=`${cats[cat].emoji} ${cats[cat].label}\n`;
      items.forEach(f=>{text+=`${checked.has(f.id)?'✓':'○'} ${f.name}\n`;});
      text+='\n';
    });
    if(navigator.share){try{await navigator.share({title:'Lista della Spesa',text});return;}catch(_){}}
    try{await navigator.clipboard.writeText(text);setFeedback('✓ Lista copiata!');setTimeout(()=>setFeedback(''),2500);}
    catch(_){setFeedback('Errore nel copiare');}
  }
  return(
    <div className="ov" onClick={onClose}>
      <div className="mod" onClick={e=>e.stopPropagation()}>
        <h2>🛒 Lista della Spesa</h2>
        <p style={{fontSize:'14px',color:'#8e6e50',marginBottom:'10px'}}>{weekLongLabel(weekOff)}</p>
        {isEmpty?<p className="sp-empty">Nessun alimento pianificato.</p>:(
          <div style={{maxHeight:'46vh',overflowY:'auto',marginBottom:'12px'}}>
            {Object.entries(grouped).map(([cat,items])=>{
              const c=cats[cat];
              return(
                <div key={cat}>
                  <div className="sp-cat-hdr" style={{background:c.bg,color:c.text}}>{c.emoji} {c.label}</div>
                  {items.map(f=>(
                    <div key={f.id} className="sp-item" onClick={()=>toggle(f.id)}>
                      <div className="sp-check" style={{background:checked.has(f.id)?'#3a1806':'transparent',borderColor:checked.has(f.id)?'#3a1806':'#b49468'}}>{checked.has(f.id)&&'✓'}</div>
                      <span className={`sp-name${checked.has(f.id)?' done':''}`}>{f.name}</span>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        )}
        {!isEmpty&&<button className="mc-green" onClick={share}>📤 Condividi lista</button>}
        <div className="sp-feedback">{feedback}</div>
        <button className="mk" style={{width:'100%',marginTop:'6px'}} onClick={onClose}>Chiudi</button>
      </div>
    </div>
  );
}

  const [aiError,setAiError]=useState(''); // 'esclusi'|'frigo'
  const [loaded,setLoaded]     =useState(false);
  const [toast,setToast]       =useState('');
  const [modal,setModal]       =useState(null);
  const [confirm,setConfirm]   =useState(null);
  const [nName,setNName]       =useState('');
  const [nCat,setNCat]         =useState('verdure');
  const [ncName,setNcName]     =useState('');
  const [ncEmoji,setNcEmoji]   =useState('🍴');
  const [ncColor,setNcColor]   =useState('#ffb3c1');
  const dragRef     =useRef(null);
  const justDragged =useRef(false);
  const weekOffRef  =useRef(weekOff);
  const toastTimer  =useRef(null);
  const [dragVis,setDragVis]   =useState(null);
  const [dropCell,setDropCell] =useState(null);
  const [dropFridge,setDropFridge]=useState(false);
  const dropFridgeRef=useRef(false);
  const savedMealsRef=useRef(savedMeals);
  const fmRef=useRef({});
  const [dropExcluded,setDropExcluded]=useState(false);
  const dropExcludedRef=useRef(false);
  const longPressTimer=useRef(null);
  const [longPressCell,setLongPressCell]=useState(null);
  const [comboLabels,setComboLabels]=useState({});

  useEffect(()=>{weekOffRef.current=weekOff;},[weekOff]);
  useEffect(()=>{dropFridgeRef.current=dropFridge;},[dropFridge]);
  useEffect(()=>{savedMealsRef.current=savedMeals;},[savedMeals]);
  useEffect(()=>{fmRef.current=Object.fromEntries(foods.map(f=>[f.id,f]));},[foods]);
  useEffect(()=>{dropExcludedRef.current=dropExcluded;},[dropExcluded]);

  useEffect(()=>{
    const m=store.get('meals_v8');if(m)try{setAllMeals(JSON.parse(m));}catch(_){}
    const c=store.get('cats_v8'); if(c)try{setCats(JSON.parse(c));}catch(_){}
    const s=store.get('saved_v8');if(s)try{setSavedMeals(JSON.parse(s));}catch(_){}
    const ex=store.get('excl_v8');if(ex)try{setExcluded(JSON.parse(ex));}catch(_){}
    const cl=store.get('clabels_v8');if(cl)try{setComboLabels(JSON.parse(cl));}catch(_){}
    const fr=store.get('fridge_v8');if(fr)try{setFridge(JSON.parse(fr));}catch(_){}
    const pr=store.get('prefs_v8');if(pr)try{setPrefs(JSON.parse(pr));}catch(_){}
    // Merge: carica salvati e aggiunge alimenti base mancanti per ID
    const f=store.get('foods_v8');
    if(f){
      try{
        const saved=JSON.parse(f);
        const savedIds=new Set(saved.map(x=>x.id));
        const savedNames=new Set(saved.map(x=>x.name.toLowerCase()));
        const missing=INIT_FOODS.filter(x=>!savedIds.has(x.id)&&!savedNames.has(x.name.toLowerCase()));
        setFoods(missing.length>0?[...saved,...missing]:saved);
      }catch(_){setFoods(INIT_FOODS);}
    }
    setLoaded(true);
  },[]);
  useEffect(()=>{if(loaded)store.set('meals_v8',JSON.stringify(allMeals));},[allMeals,loaded]);
  useEffect(()=>{if(loaded)store.set('foods_v8',JSON.stringify(foods));},[foods,loaded]);
  useEffect(()=>{if(loaded)store.set('cats_v8', JSON.stringify(cats));},[cats,loaded]);
  useEffect(()=>{if(loaded)store.set('saved_v8',JSON.stringify(savedMeals));},[savedMeals,loaded]);
  useEffect(()=>{if(loaded)store.set('excl_v8',JSON.stringify(excluded));},[excluded,loaded]);
  useEffect(()=>{if(loaded)store.set('clabels_v8',JSON.stringify(comboLabels));},[comboLabels,loaded]);
  useEffect(()=>{if(loaded)store.set('fridge_v8',JSON.stringify(fridge));},[fridge,loaded]);
  useEffect(()=>{if(loaded)store.set('prefs_v8',JSON.stringify(prefs));},[prefs,loaded]);

  const wk    =weekKey(weekOff);
  const meals =allMeals[wk]||{};

  function updateMeals(fn){
    setAllMeals(prev=>({...prev,[weekKey(weekOffRef.current)]:fn(prev[weekKey(weekOffRef.current)]||{})}));
  }
  function showToast(msg){
    setToast(msg);
    if(toastTimer.current)clearTimeout(toastTimer.current);
    toastTimer.current=setTimeout(()=>setToast(''),2500);
  }

  useEffect(()=>{
    function onMove(e){
      const d=dragRef.current;if(!d)return;
      const dx=e.clientX-d.startX,dy=e.clientY-d.startY;
      if(!d.active&&Math.sqrt(dx*dx+dy*dy)>8)d.active=true;
      if(!d.active)return;
      setDragVis({foodId:d.foodId,x:e.clientX-d.offsetX,y:e.clientY-d.offsetY});
      const els=document.elementsFromPoint(e.clientX,e.clientY);
      const cel=els.find(el=>el.dataset&&el.dataset.cell);
      setDropCell(cel?cel.dataset.cell:null);
      const frgEl=els.find(el=>el.dataset&&el.dataset.fridgedrop);
      setDropFridge(!!frgEl&&dragRef.current?.fromCell===null);
      const exclEl=els.find(el=>el.dataset&&el.dataset.excludeddrop);
      setDropExcluded(!!exclEl&&dragRef.current?.fromCell===null);
    }
    function onUp(e){
      const d=dragRef.current;if(!d)return;
      const wasFridge=dropFridgeRef.current;
      const wasExcluded=dropExcludedRef.current;
      dragRef.current=null;setDragVis(null);setDropCell(null);setDropFridge(false);setDropExcluded(false);
      const wkNow=weekKey(weekOffRef.current);
      if(d.active){
        justDragged.current=true;
        setTimeout(()=>{justDragged.current=false;},80);
        const els=document.elementsFromPoint(e.clientX,e.clientY);
        const cel=els.find(el=>el.dataset&&el.dataset.cell);
        const ck=cel?cel.dataset.cell:null;

        if(wasFridge && d.fromCell===null){
          // COPY from pantry to fridge
          addToFridge(d.foodId);
          showToast('🥶 Aggiunto al frigo!');
        } else if(wasExcluded && d.fromCell===null){
          // MOVE to excluded (disappears from pantry)
          if(!excluded.includes(d.foodId)) setExcluded(p=>[...p,d.foodId]);
          showToast('🚫 Alimento escluso!');
        } else if(ck){
          // If dragging a combo, place all its foods
          if(d.comboId){
            const combo=savedMealsRef.current.find(c=>c.id===d.comboId);
            if(combo){
              const fmNow=fmRef.current;
              const validIds=combo.foodIds.filter(id=>fmNow[id]);
              const wkNow=weekKey(weekOffRef.current);
              setAllMeals(prev=>{const cur={...(prev[wkNow]||{})};cur[ck]=validIds;return{...prev,[wkNow]:cur};});
              setComboLabels(p=>({...p,[ck]:combo.name}));
            }
            return;
          }
          // DROP onto a cell
          setAllMeals(prev=>{
            let cur={...(prev[wkNow]||{})};
            // If coming from another cell, remove from source
            if(d.fromCell && d.fromCell!==ck){
              cur={...cur,[d.fromCell]:(cur[d.fromCell]||[]).filter(id=>id!==d.foodId)};
              if(!cur[d.fromCell].length)delete cur[d.fromCell];
            }
            // Add to target cell (move from pantry = just add, already absent from week)
            const ids=cur[ck]||[];
            if(!ids.includes(d.foodId))cur={...cur,[ck]:[...ids,d.foodId]};
            return{...prev,[wkNow]:cur};
          });
        } else if(d.fromCell){
          // Dropped outside any cell → return to pantry (remove from cell)
          setAllMeals(prev=>{
            const cur={...(prev[wkNow]||{})};
            cur[d.fromCell]=(cur[d.fromCell]||[]).filter(id=>id!==d.foodId);
            if(!cur[d.fromCell].length)delete cur[d.fromCell];
            return{...prev,[wkNow]:cur};
          });
        }
        // Dropped back onto pantry area from pantry = no-op (food was never in week)
      }else{
        // Tap (no drag movement): toggle select only if from pantry
        if(d.fromCell===null)setSel(p=>p===d.foodId?null:d.foodId);
      }
    }
    window.addEventListener('pointermove',onMove,{passive:true});
    window.addEventListener('pointerup',onUp);
    return()=>{window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);};
  },[]);

  function startDrag(e,foodId,fromCell,comboId){
    if(e.target.closest&&e.target.closest('.tx'))return;
    e.preventDefault();
    const rect=e.currentTarget.getBoundingClientRect();
    dragRef.current={foodId,fromCell,comboId:comboId||null,offsetX:e.clientX-rect.left,offsetY:e.clientY-rect.top,startX:e.clientX,startY:e.clientY,active:false};
  }

  const fm      =useMemo(()=>Object.fromEntries(foods.map(f=>[f.id,f])),[foods]);
  const selFood =sel?fm[sel]:null;
  const catOrder=Object.keys(cats);
  const pFoods  =useMemo(()=>
    (fCat==='all'?foods:foods.filter(f=>f.cat===fCat))
    .filter(f=>!excluded.includes(f.id))
    .filter(f=>!search||f.name.toLowerCase().includes(search.toLowerCase()))
    .slice().sort((a,b)=>{const d=catOrder.indexOf(a.cat)-catOrder.indexOf(b.cat);return d!==0?d:a.name.localeCompare(b.name,'it');})
  ,[foods,fCat,cats,excluded,search]);

  function onCellTouchStart(e, ck){
    if(e.target.closest('.tx')||e.target.closest('.tag')) return;
    longPressTimer.current = setTimeout(()=>{
      longPressTimer.current=null;
      const ids = meals[ck]||[];
      if(ids.length>0){ openSaveCombo(ck); }
    }, 650);
  }
  function onCellTouchEnd(){
    if(longPressTimer.current){ clearTimeout(longPressTimer.current); longPressTimer.current=null; }
  }

  function clickCell(ck){
    if(justDragged.current)return;
    if(selCombo){
      const combo=savedMeals.find(c=>c.id===selCombo);
      if(combo){
        const validIds=combo.foodIds.filter(id=>fm[id]);
        updateMeals(cur=>({...cur,[ck]:validIds}));
        setComboLabels(p=>({...p,[ck]:combo.name}));
      }
      setSelCombo(null); return;
    }
    if(!sel)return;
    updateMeals(cur=>{const ids=cur[ck]||[];if(ids.includes(sel))return cur;return{...cur,[ck]:[...ids,sel]};});
    setSel(null);
  }
  function removeFromCell(ck,fid){
    updateMeals(cur=>{const n={...cur,[ck]:(cur[ck]||[]).filter(id=>id!==fid)};if(!n[ck].length){delete n[ck];setComboLabels(p=>{const nl={...p};delete nl[ck];return nl;});}return n;});
    // Restore qty in fridge if this food is there
    setFridge(p=>{
      const item=p.find(x=>x.foodId===fid);
      if(!item) return p;
      return p.map(x=>x.foodId===fid?{...x,qty:x.qty+1}:x);
    });
  }
  function deleteFood(fid){
    setFoods(p=>p.filter(f=>f.id!==fid));
    setAllMeals(prev=>{const np={};Object.keys(prev).forEach(w=>{const c={...prev[w]};Object.keys(c).forEach(k=>{c[k]=c[k].filter(id=>id!==fid);if(!c[k].length)delete c[k];});np[w]=c;});return np;});
    if(sel===fid)setSel(null);
  }
  function addFood(){
    const name=nName.trim(); if(!name)return;
    if(foods.some(f=>f.name.toLowerCase()===name.toLowerCase())){
      showToast('⚠️ Alimento già presente!'); return;
    }
    setFoods(p=>[...p,{id:uid(),name,cat:nCat}]);
    setNName(''); setModal(null);
  }
  function addCat(){
    if(!ncName.trim())return;
    setCats(p=>({...p,[catUid()]:{label:ncName.trim(),emoji:ncEmoji,custom:true,...autoColors(ncColor)}}));
    setNcName('');setNcEmoji('🍴');setNcColor('#ffb3c1');setModal('catManage');
  }
  function deleteCat(id,label){
    setConfirm({msg:`Eliminare "${label}"? Gli alimenti andranno in "Altro".`,warn:true,confirmLabel:'Elimina',onConfirm:()=>{
      setFoods(p=>p.map(f=>f.cat===id?{...f,cat:'altro'}:f));
      setCats(p=>{const n={...p};delete n[id];return n;});
      if(fCat===id)setFCat('all');
    }});
  }
  function openAddFood(){setNCat(Object.keys(cats)[0]||'altro');setModal('addFood');setEditM(false);}

  // ── AI Ricette ───────────────────────────────────────────────────────────────
  function openAiModal(){
    // Pre-fill with fridge ingredients if any
    const fridgeNames=fridge.map(item=>fm[item.foodId]?.name).filter(Boolean);
    setAiIngredients(fridgeNames.length>0?fridgeNames:[]);
    setAiResult(null); setAiError(''); setAiModal(true);
  }

  async function fetchAiRecipes(){
    if(!aiIngredients.length){setAiError('Aggiungi almeno un ingrediente!');return;}
    setAiLoading(true); setAiResult(null); setAiError('');
    try{
      const prompt=`Sei un cuoco italiano esperto. L'utente ha questi ingredienti: ${aiIngredients.join(', ')}.
Suggerisci 2-3 ricette italiane che usano questi ingredienti (non serve usarli tutti).
Per ogni ricetta scrivi:
- Nome ricetta (breve e appetitoso)
- Ingredienti con dosi per 2 persone
- Procedimento in 3-5 passaggi semplici
- Tempo di preparazione
Sii conciso e pratico. Rispondi in italiano.`;

      const response=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:1500,
          messages:[{role:'user',content:prompt}]
        })
      });
      const data=await response.json();
      if(data.error){setAiError('Errore API: '+data.error.message);}
      else{setAiResult(data.content[0].text);}
    }catch(e){
      setAiError('Errore di connessione. Riprova!');
    }
    setAiLoading(false);
  }

  function saveAiAsRecipe(name, ids){
    if(!ids.length)return;
    setSavedMeals(p=>[...p,{id:'sm'+Date.now(),name,foodIds:ids}]);
    showToast('👩🏻‍🍳 Ricetta salvata!');
  }

  // ── Ricette salvate ──────────────────────────────────────────────────────────
  function openSaveCombo(ck){
    const ids=meals[ck]||[];
    if(!ids.length)return;
    const names=ids.map(id=>fm[id]?.name).filter(Boolean).join(' + ');
    setSaveComboName(names);
    setSaveComboCell(ck);
  }
  function confirmSaveCombo(){
    const ids=meals[saveComboCell]||[];
    if(!ids.length)return;
    const name=saveComboName.trim()||ids.map(id=>fm[id]?.name).filter(Boolean).join(' + ');
    setSavedMeals(p=>[...p,{id:'sm'+Date.now(),name,foodIds:ids}]);
    setSaveComboCell(null); setSaveComboName('');
    showToast('👩🏻‍🍳 Ricetta salvata!');
  }
  function deleteCombo(id){setSavedMeals(p=>p.filter(c=>c.id!==id));}

  // ── Esclusi ──────────────────────────────────────────────────────────────────
  function toggleExcluded(fid){
    setExcluded(p=>p.includes(fid)?p.filter(id=>id!==fid):[...p,fid]);
  }
  // ── Frigo ─────────────────────────────────────────────────────────────────────
  function addToFridge(fid){
    setFridge(p=>{const ex=p.find(x=>x.foodId===fid);if(ex)return p.map(x=>x.foodId===fid?{...x,qty:x.qty+1}:x);return[...p,{foodId:fid,qty:1}];});
  }
  function removeFromFridge(fid){setFridge(p=>p.filter(x=>x.foodId!==fid));}
  function fridgeQty(fid,delta){
    setFridge(p=>p.map(x=>x.foodId===fid?{...x,qty:Math.max(1,x.qty+delta)}:x));
  }
  function handleCreateFromFridge(){
    if(!fridge.length){showToast('Il frigo è vuoto!');return;}
    const newMeals=buildMenuFromFridge(fridge,foods,cats,meals);
    if(!newMeals){showToast('La settimana è già completa! 🎉');return;}
    // Count how many times each food was used in new slots
    const oldMeals=meals;
    const used={};
    Object.keys(newMeals).forEach(ck=>{
      if(!oldMeals[ck]||oldMeals[ck].length===0){
        (newMeals[ck]||[]).forEach(id=>{ used[id]=(used[id]||0)+1; });
      }
    });
    // Scale down fridge quantities
    setFridge(p=>p.map(item=>{
      const q=Math.max(0,item.qty-(used[item.foodId]||0));
      return {...item,qty:q};
    }));
    const filled=Object.keys(newMeals).filter(ck=>!(oldMeals[ck]?.length>0)).length;
    setAllMeals(prev=>({...prev,[wk]:newMeals}));
    showToast(filled>0?`🥶 ${filled} pasti dal frigo!`:'La settimana è già completa! 🎉');
    setPantryTab('dispensa');
  }
  // ── Sorprendimi bilanciato ──────────────────────────────────────────────────
  function handleSorprendimi(){
    if(!foods.length){showToast('La dispensa è vuota!');return;}
    const newMeals=buildBalancedMenu(foods,cats,meals,savedMeals,excluded,prefs,allMeals);
    if(!newMeals){showToast('La settimana è già completa! 🎉');return;}
    const filled=Object.keys(newMeals).length-Object.keys(meals).length;
    setAllMeals(prev=>({...prev,[wk]:newMeals}));
    showToast(filled>0?`✨ ${filled} piatti aggiunti!`:'La settimana è già completa! 🎉');
  }

  // ── Condividi menu come IMMAGINE ────────────────────────────────────────────
  async function handleShareMenu(){
    const canvas=generateMenuCanvas(meals,foods,cats,weekOff);
    // Try to share as image
    canvas.toBlob(async blob=>{
      if(!blob)return;
      const file=new File([blob],'menu.png',{type:'image/png'});
      // 1. Try Web Share API with file
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:'Menu Settimanale'});return;}catch(_){}
      }
      // 2. Fallback: download the image
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='menu-settimanale.png';a.click();
      URL.revokeObjectURL(url);
      showToast('📥 Immagine salvata!');
    },'image/png');
  }

  // ── Condividi lista spesa testo ──────────────────────────────────────────────
  function handleClear(){
    setConfirm({msg:`Cancellare tutti i pasti di ${weekLongLabel(weekOff)}?`,warn:true,confirmLabel:'Sì, pulisci',
      onConfirm:()=>{setAllMeals(prev=>{const n={...prev};delete n[wk];return n;});setComboLabels({});}});
  }

  return(
    <>
      <style>{CSS}</style>
      <div className="app">
        <header className="hdr"><h1>🍽️ Menu Settimanale</h1></header>
        <div className="wbar">
          <div className="wnav">
            <button className="wbtn" onClick={()=>setWeekOff(p=>p-1)}>‹</button>
            <span className="wlabel">{weekShortLabel(weekOff)}</span>
            <button className="wbtn" onClick={()=>setWeekOff(p=>p+1)}>›</button>
          </div>
          <div className="wactions">
            <button className="wact" title="Preferenze" onClick={()=>setModal('prefs')}>⚙️</button>
            <button className="wact" title="Lista della spesa" onClick={()=>setModal('spesa')}>🛒</button>
            <button className="wact" title="Sorprendimi!" onClick={handleSorprendimi}>🪄</button>
            <button className="wact" title="Condividi come immagine" onClick={handleShareMenu}>📮</button>
            <button className="wact" title="Pulisci settimana" onClick={handleClear}>🗑️</button>
          </div>
        </div>

        {selCombo&&!dragVis&&(()=>{const combo=savedMeals.find(c=>c.id===selCombo);return combo&&(
          <div className="banner" style={{background:'linear-gradient(135deg,#f0e8ff,#e4d4ff)',borderColor:'#9c6fcc'}}>
            <span className="banner-txt" style={{color:'#3a1260'}}>⭐ Tocca una casella per inserire:</span>
            <span style={{fontWeight:700,color:'#3a1260',fontSize:'14px'}}>{combo.name}</span>
            <button className="banner-x" style={{color:'#3a1260'}} onClick={()=>setSelCombo(null)}>✕</button>
          </div>
        );})()}
        {selFood&&!dragVis&&!selCombo&&(
          <div className="banner">
            <span className="banner-txt">📌 Tocca una casella per aggiungere:</span>
            <Tag food={selFood} cats={cats} selected/>
            <button className="banner-x" onClick={()=>setSel(null)}>✕</button>
          </div>
        )}

        {!loaded?<div className="loading">Caricamento…</div>:(
          <div className="gs">
            <div className="gh"><div/><div className="cl">🌞 Pranzo</div><div className="cl">🌙 Cena</div></div>
            {DAYS.map((day,di)=>(
              <div key={day} className="dr">
                <div className="dl">{DAYS_SHORT[di]}</div>
                {['Pranzo','Cena'].map(meal=>{
                  const ck=`${day}-${meal}`,ids=meals[ck]||[];
                  return(
                    <div key={meal} data-cell={ck}
                      className={`cell${dropCell===ck?' drop-target':''}${(sel||selCombo)&&!dragVis?' sel-active':''}`}
                      onClick={()=>clickCell(ck)}
                      onTouchStart={e=>onCellTouchStart(e,ck)}
                      onTouchEnd={onCellTouchEnd}
                      onTouchMove={onCellTouchEnd}>
                      {comboLabels[ck]&&<div className="combo-cell-label">{comboLabels[ck]}</div>}
                      {ids.map(fid=>{const f=fm[fid];if(!f)return null;
                        const isDrag=dragVis?.foodId===fid&&dragRef.current?.fromCell===ck;
                        return<Tag key={fid+ck} food={f} cats={cats} dragging={isDrag} onPointerDown={e=>startDrag(e,fid,ck)} showX onX={()=>removeFromCell(ck,fid)}/>;
                      })}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}

        <div className="pantry">
          <div className="pth" onClick={()=>setPOpen(p=>!p)}><div className="ph"/></div>
          <div className="pr">
            <div className="ptr" onClick={()=>{if(!searchOpen)setPOpen(p=>!p);}}>
              {!searchOpen&&<><span className="pt">Dispensa</span><span style={{fontSize:'12px',color:'#8e6e50'}}>{pOpen?'▼':'▲'}</span></>}
            </div>
            {searchOpen&&(
              <div className="search-expand" onClick={e=>e.stopPropagation()}>
                <span className="search-icon">🔍</span>
                <input ref={searchInputRef} className="search-input" placeholder="Cerca alimento…" value={search} onChange={e=>setSearch(e.target.value)}/>
                <button className="search-clear" onClick={()=>{setSearch('');setSearchOpen(false);}}>✕</button>
              </div>
            )}
            <div className="pact" onClick={e=>e.stopPropagation()}>
              {!searchOpen&&<button className="pab" onClick={()=>{setSearchOpen(true);setPOpen(true);setTimeout(()=>searchInputRef.current?.focus(),50);}}>🔍</button>}
              <button className="pab" onClick={()=>setFCat(p=>p==='ricette'?'all':'ricette')} style={fCat==='ricette'?{background:'#3a1806',color:'#f4e6cc',borderColor:'#3a1806'}:{}}>👩🏻‍🍳</button>
              <button className="pab" onClick={()=>{setModal('catManage');setEditM(false);}}>🎨</button>
              <button className={`pab${editM?' on':''}`} onClick={()=>setEditM(p=>!p)}>{editM?'✓':'✏️'}</button>
            </div>
          </div>
          {pOpen&&<>
            {/* Tab switcher */}
            <div className="pantry-tabs">
              <button className={`ptab${pantryTab==='dispensa'?' on':''}`} onClick={()=>setPantryTab('dispensa')}>🥫 Dispensa</button>
              <button data-excludeddrop="1" className={`ptab${pantryTab==='esclusi'?' on':''}${dropExcluded?' drop-excluded':''}`} onClick={()=>setPantryTab('esclusi')}>🚫 Esclusi{dropExcluded&&' −'}</button>
              <button data-fridgedrop="1" className={`ptab${pantryTab==='frigo'?' on':''}${dropFridge?' drop-fridge':''}`} onClick={()=>setPantryTab('frigo')}>🥶 Frigo{dropFridge&&' +'}</button>
            </div>

            {/* DISPENSA */}
            {pantryTab==='dispensa'&&<>
              <div className="cf">
                <button className={`cfb${fCat==='all'?' on':''}`} onClick={()=>setFCat('all')}>Tutti</button>
                {Object.entries(cats).map(([k,c])=>(
                  <button key={k} className={`cfb${fCat===k?' on':''}`} onClick={()=>setFCat(k)}>{c.emoji} {c.label}</button>
                ))}
                <button className={`cfb${fCat==='ricette'?' on':''}`} style={fCat==='ricette'?{}:{background:'rgba(156,111,204,.15)',color:'#3a1260'}} onClick={()=>setFCat('ricette')}>👩🏻‍🍳 Ricette</button>
              </div>
              <div className="pf">
                {fCat==='ricette'?(
                  savedMeals.length===0
                    ?<span style={{fontSize:'14px',color:'#8e6e50',padding:'6px 0'}}>Nessuna ricetta. Usa 👩🏻‍🍳 su una casella!</span>
                    :savedMeals.map(combo=>(
                      <div key={combo.id} className={`combo-chip${selCombo===combo.id?' sel':''}${dragVis?.comboId===combo.id?' dragging':''}`}
                        onPointerDown={e=>startDrag(e,combo.foodIds[0]||'',null,combo.id)}
                        onClick={()=>setSelCombo(p=>p===combo.id?null:combo.id)}
                        style={{touchAction:'none',cursor:'grab'}}>
                        <span className="combo-name">{combo.name}</span>
                        {editM&&<button className="tx" style={{position:'static',marginLeft:'4px'}} onClick={e=>{e.stopPropagation();deleteCombo(combo.id);}}>✕</button>}
                      </div>
                    ))
                ):(
                  <>
                  {pFoods.map(food=>(
                    <Tag key={food.id} food={food} cats={cats} selected={sel===food.id}
                      dragging={dragVis?.foodId===food.id&&dragRef.current?.fromCell===null}
                      onPointerDown={editM?undefined:e=>startDrag(e,food.id,null)}
                      showX={editM} onX={()=>deleteFood(food.id)}/>
                  ))}
                  <button className="ab" onClick={openAddFood}>+</button>
                  </>
                )}
              </div>
            </>}

            {/* ESCLUSI */}
            {pantryTab==='esclusi'&&<>
              <p className="pantry-hint">Trascina 🚫 per escludere · tocca per re-includere</p>
              <div className="pf">
                {excluded.length===0&&<span style={{fontSize:'13px',color:'#8e6e50',padding:'6px 0'}}>Nessun alimento escluso. Trascina qui dalla dispensa!</span>}
                {foods.filter(f=>excluded.includes(f.id)).sort((a,b)=>{const d=catOrder.indexOf(a.cat)-catOrder.indexOf(b.cat);return d!==0?d:a.name.localeCompare(b.name,'it');}).map(food=>{
                  const isExcl=true;
                  const c=cats[food.cat]||INIT_CATS.altro;
                  return(
                    <span key={food.id}
                      className={`tag${isExcl?' excl-tag':''}`}
                      style={{background:c.bg,color:c.text,borderColor:'#b03020',
                        transform:`rotate(${hashRot(food.id)}deg)`,
                        opacity:0.5,textDecoration:'line-through',cursor:'pointer'}}
                      onClick={()=>toggleExcluded(food.id)}>
                      {food.name}{isExcl?' 🚫':''}
                    </span>
                  );
                })}
              </div>
              {excluded.length>0&&<p className="pantry-hint" style={{color:'#b03020'}}>{excluded.length} {excluded.length===1?'alimento escluso':'alimenti esclusi'}</p>}
            </>}

            {/* FRIGO */}
            {pantryTab==='frigo'&&<>
              <div data-fridgedrop="1" className={`frigo-dropzone${dropFridge?' active':''}`}>
                {dropFridge?'+ Rilascia qui per aggiungere al frigo':'Trascina alimenti dalla dispensa · o usa +'}
              </div>
              <div className="pf" style={{maxHeight:'90px'}}>
                {fridge.map(item=>{const f=fm[item.foodId];if(!f)return null;const c=cats[f.cat]||INIT_CATS.altro;const exhausted=item.qty===0;return(
                  <div key={item.foodId} className="fridge-item" style={{background:c.bg,borderColor:exhausted?'#ccc':c.border,color:c.text,opacity:exhausted?0.45:1}}>
                    <span className="fridge-name">{f.name}</span>
                    <div className="fridge-ctrl">
                      <button className="qty-btn" onClick={()=>fridgeQty(item.foodId,-1)}>−</button>
                      <span className="qty-val">{item.qty}</span>
                      <button className="qty-btn" onClick={()=>fridgeQty(item.foodId,1)}>+</button>
                      <button className="qty-btn" style={{marginLeft:'2px',color:'#b03020'}} onClick={()=>removeFromFridge(item.foodId)}>✕</button>
                    </div>
                  </div>
                );})}
                <button className="ab" onClick={()=>setFoodPicker('frigo')}>+</button>
              </div>
              <div style={{padding:'6px 8px 8px',display:'flex',gap:'5px'}}>
                <button className="mc-green" style={{flex:1,fontSize:'13px',padding:'6px 4px'}} onClick={handleCreateFromFridge}>📝 Crea</button>
                <button className="ai-btn" style={{flex:2,margin:0}} onClick={openAiModal}>🔎 Cerca ricette</button>
                <button className="mk" style={{fontSize:'15px',padding:'6px 8px',flexShrink:0}} onClick={()=>setConfirm({msg:'Svuotare il frigo?',warn:false,confirmLabel:'🧹 Svuota',onConfirm:()=>setFridge([])})} title="Svuota frigo">🧹</button>
              </div>
            </>}
          </>}
        </div>

        {dragVis&&(dragRef.current?.comboId?(()=>{
          const combo=savedMeals.find(c=>c.id===dragRef.current.comboId);
          return combo?(<div className="ghost" style={{left:dragVis.x,top:dragVis.y}}>
            <div className="combo-chip sel" style={{transform:'scale(1.08)',boxShadow:'3px 6px 16px rgba(0,0,0,.35)',cursor:'grabbing'}}>
              {combo.name}
            </div>
          </div>):null;
        })():fm[dragVis.foodId]?<GhostTag food={fm[dragVis.foodId]} cats={cats} x={dragVis.x} y={dragVis.y}/>:null)}
        {toast&&<div className="toast">{toast}</div>}

        {modal==='addFood'&&(
          <div className="ov" onClick={()=>setModal(null)}>
            <div className="mod" onClick={e=>e.stopPropagation()}>
              <h2>Aggiungi Alimento</h2>
              <input className="min" placeholder="Nome alimento…" value={nName} onChange={e=>setNName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addFood()} autoFocus/>
              <div className="cg">{Object.entries(cats).map(([k,c])=>(<button key={k} className={`co${nCat===k?' on':''}`} style={{background:c.bg,color:c.text,borderColor:nCat===k?c.text:'transparent'}} onClick={()=>setNCat(k)}>{c.emoji} {c.label}</button>))}</div>
              <div className="ma"><button className="mc" onClick={addFood}>Aggiungi</button><button className="mk" onClick={()=>setModal(null)}>Annulla</button></div>
            </div>
          </div>
        )}
        {modal==='catManage'&&(
          <div className="ov" onClick={()=>setModal(null)}>
            <div className="mod" onClick={e=>e.stopPropagation()}>
              <h2>🎨 Categorie</h2>
              <div className="cat-list">{Object.entries(cats).map(([k,c])=>(
                <div key={k} className="cat-item" style={{background:c.bg,borderColor:c.border}}>
                  <div className="cat-item-info" style={{color:c.text}}><span style={{fontSize:'20px'}}>{c.emoji}</span><span>{c.label}</span></div>
                  {k!=='altro'&&<button className="cat-del-btn" style={{color:c.text}} onClick={()=>deleteCat(k,c.label)}>✕</button>}
                </div>
              ))}</div>
              <button className="add-cat-btn" onClick={()=>setModal('addCat')}>+ Nuova categoria</button>
              <div className="ma"><button className="mc" onClick={()=>setModal(null)}>Chiudi</button></div>
            </div>
          </div>
        )}
        {modal==='addCat'&&(
          <div className="ov" onClick={()=>setModal('catManage')}>
            <div className="mod" onClick={e=>e.stopPropagation()}>
              <h2>Nuova Categoria</h2>
              <div className="emoji-name-row">
                <input className="emoji-in" placeholder="🍴" value={ncEmoji} onChange={e=>setNcEmoji(e.target.value)} maxLength={2}/>
                <input className="name-in" placeholder="Nome categoria…" value={ncName} onChange={e=>setNcName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCat()} autoFocus/>
              </div>
              <div className="color-section">
                <label>Scegli colore</label>
                <div className="color-presets">{COLOR_PRESETS.map(hex=>(<div key={hex} className={`cp-swatch${ncColor===hex?' on':''}`} style={{background:hex}} onClick={()=>setNcColor(hex)}/>))}</div>
                <div className="color-custom-row">
                  <label>Personalizzato:</label>
                  <input type="color" className="color-input" value={ncColor} onChange={e=>setNcColor(e.target.value)}/>
                  <span className="color-hex">{ncColor}</span>
                </div>
              </div>
              <div className="tag-preview"><span>Anteprima:</span><TagPreview name={ncName} emoji={ncEmoji} color={ncColor}/></div>
              <div className="ma"><button className="mc" onClick={addCat}>Aggiungi</button><button className="mk" onClick={()=>setModal('catManage')}>Indietro</button></div>
            </div>
          </div>
        )}
        {modal==='spesa'&&<SpesaModal meals={meals} foods={foods} cats={cats} weekOff={weekOff} onClose={()=>setModal(null)}/>}
        {modal==='prefs'&&(
          <div className="ov" onClick={()=>setModal(null)}>
            <div className="mod" onClick={e=>e.stopPropagation()}>
              <h2>⚙️ Preferenze Settimanali</h2>
              <p style={{fontSize:'14px',color:'#8e6e50',marginBottom:'16px'}}>Quante volte a settimana vuoi ogni proteina? Il 🪄 Sorprendimi rispetterà questi limiti.</p>
              {['carne','pesce','legumi','uova','latticini'].filter(k=>cats[k]).map(k=>{
                const c=cats[k]; const val=prefs[k]!==undefined?prefs[k]:2;
                return(
                  <div key={k} className="pref-row">
                    <span className="pref-chip" style={{background:c.bg,color:c.text}}>{c.emoji} {c.label}</span>
                    <div className="pref-ctrl">
                      <button className="qty-btn" onClick={()=>setPrefs(p=>({...p,[k]:Math.max(0,(p[k]??2)-1)}))} >−</button>
                      <span className="qty-val">{val}×</span>
                      <button className="qty-btn" onClick={()=>setPrefs(p=>({...p,[k]:Math.min(14,(p[k]??2)+1)}))}>+</button>
                    </div>
                  </div>
                );
              })}
              <div style={{marginTop:'16px'}}><button className="mc" onClick={()=>setModal(null)}>Fatto ✓</button></div>
            </div>
          </div>
        )}
        {foodPicker&&(
          <div className="ov" onClick={()=>setFoodPicker(null)}>
            <div className="mod" onClick={e=>e.stopPropagation()}>
              <h2>{foodPicker==='frigo'?'🥶 Aggiungi al frigo':'🚫 Escludi alimento'}</h2>
              <div style={{maxHeight:'55vh',overflowY:'auto'}}>
                {foods.slice().sort((a,b)=>{const d=catOrder.indexOf(a.cat)-catOrder.indexOf(b.cat);return d!==0?d:a.name.localeCompare(b.name,'it');}).map(food=>{
                  const c=cats[food.cat]||INIT_CATS.altro;
                  const inFridge=fridge.some(x=>x.foodId===food.id);
                  return(
                    <div key={food.id} className="sp-item" onClick={()=>{if(foodPicker==='frigo')addToFridge(food.id);else toggleExcluded(food.id);}}>
                      <div className="sp-check" style={{background:(foodPicker==='frigo'?inFridge:excluded.includes(food.id))?'#3a1806':'transparent',borderColor:(foodPicker==='frigo'?inFridge:excluded.includes(food.id))?'#3a1806':'#b49468'}}>
                        {(foodPicker==='frigo'?inFridge:excluded.includes(food.id))&&'✓'}
                      </div>
                      <span className="tag" style={{background:c.bg,color:c.text,borderColor:c.border,transform:`rotate(${hashRot(food.id)}deg)`,cursor:'default'}}>{food.name}</span>
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:'12px'}}><button className="mc" onClick={()=>setFoodPicker(null)}>Fatto ✓</button></div>
            </div>
          </div>
        )}
        {saveComboCell&&(
          <div className="ov" onClick={()=>setSaveComboCell(null)}>
            <div className="mod mod-sm" onClick={e=>e.stopPropagation()}>
              <h2>👩🏻‍🍳 Salva Ricetta</h2>
              <p style={{fontSize:'14px',color:'#8e6e50',marginBottom:'10px'}}>
                {(meals[saveComboCell]||[]).map(id=>fm[id]?.name).filter(Boolean).join(' + ')}
              </p>
              <input className="min" placeholder="Nome ricetta…" value={saveComboName}
                onChange={e=>setSaveComboName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&confirmSaveCombo()} autoFocus/>
              <div className="ma">
                <button className="mc" onClick={confirmSaveCombo}>Salva</button>
                <button className="mk" onClick={()=>setSaveComboCell(null)}>Annulla</button>
              </div>
            </div>
          </div>
        )}
        {aiModal&&(
          <div className="ov" onClick={()=>{if(!aiLoading)setAiModal(false);}}>
            <div className="mod" onClick={e=>e.stopPropagation()}>
              <h2>✨ Ricette con l'IA</h2>
              <p style={{fontSize:'14px',color:'#8e6e50',marginBottom:'10px'}}>Ingredienti disponibili:</p>

              {/* Ingredient chips */}
              <div className="ai-chips">
                {aiIngredients.map((ing,i)=>(
                  <span key={i} className="ai-chip">
                    {ing}
                    <button className="tx" style={{position:'static',marginLeft:'4px'}}
                      onClick={()=>setAiIngredients(p=>p.filter((_,j)=>j!==i))}>✕</button>
                  </span>
                ))}
                <input className="ai-ing-input" placeholder="+ aggiungi ingrediente"
                  onKeyDown={e=>{
                    if((e.key==='Enter'||e.key===',')&&e.target.value.trim()){
                      setAiIngredients(p=>[...p,e.target.value.trim()]);
                      e.target.value='';e.preventDefault();
                    }
                  }}/>
              </div>

              {/* Error */}
              {aiError&&<p style={{color:'#b03020',fontSize:'14px',margin:'8px 0'}}>{aiError}</p>}

              {/* Result */}
              {aiResult&&(
                <div className="ai-result">
                  <div className="ai-result-text">{aiResult}</div>
                  <p style={{fontSize:'13px',color:'#8e6e50',marginTop:'10px'}}>
                    Vuoi salvare una ricetta? Aggiungi gli ingredienti nella dispensa e usala come combo 👩🏻‍🍳
                  </p>
                </div>
              )}

              {/* Loading */}
              {aiLoading&&(
                <div className="ai-loading">
                  <span className="ai-spinner">🍳</span>
                  <span>Claude sta cucinando le idee…</span>
                </div>
              )}

              <div className="ma" style={{marginTop:'14px'}}>
                <button className="mc" onClick={fetchAiRecipes} disabled={aiLoading}>
                  {aiLoading?'Caricamento…':'✨ Genera ricette'}
                </button>
                <button className="mk" onClick={()=>setAiModal(false)} disabled={aiLoading}>Chiudi</button>
              </div>
            </div>
          </div>
        )}
        {confirm&&<ConfirmModal msg={confirm.msg} confirmLabel={confirm.confirmLabel} warn={confirm.warn} onConfirm={()=>{confirm.onConfirm();setConfirm(null);}} onCancel={()=>setConfirm(null)}/>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
